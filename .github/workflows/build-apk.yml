name: Build Android APK

# Builds a debug APK in the cloud so you never need Android Studio or a local SDK.
# Runs on every push to main, and can be started by hand from the Actions tab.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project ships without a Gradle wrapper, so install Gradle 8.7 directly.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Write the Firebase config for push. If the secret isn't set, the build still succeeds -
      # the google-services plugin is applied only when this file exists, so push is simply inert.
      - name: Write google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret set - building without push (google-services plugin skipped)."
            exit 0
          fi
          # Accept either base64 (recommended) or raw JSON pasted straight into the secret,
          # and tolerate any line-wrapping/whitespace from copy-paste.
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          fi
          if python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null; then
            echo "Wrote app/google-services.json ($(wc -c < app/google-services.json) bytes) - push enabled."
          else
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 did not resolve to valid JSON. Re-copy it and update the secret."
            exit 1
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spheredex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
