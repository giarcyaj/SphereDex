name: Build Release AAB

# Builds a signed Android App Bundle (.aab) for uploading to Google Play.
# Start it by hand from the Actions tab. Needs these repo secrets:
#   KEYSTORE_BASE64   - your upload keystore, base64-encoded
#   KEYSTORE_PASSWORD - the keystore password
#   KEY_ALIAS         - the key alias
#   KEY_PASSWORD      - the key password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Unique, always-increasing version code per build so Play never rejects a re-upload.
          VERSION_CODE: ${{ 100 + github.run_number }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease --stacktrace --no-daemon
          else
            gradle bundleRelease --stacktrace --no-daemon
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: spheredex-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
