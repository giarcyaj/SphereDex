name: Build Release AAB

# Builds a signed Android App Bundle (.aab) for uploading to Google Play.
# Start it by hand from the Actions tab. Needs these repo secrets:
#   KEYSTORE_BASE64   - your upload keystore, base64-encoded
#   KEYSTORE_PASSWORD - the keystore password
#   KEY_ALIAS         - the key alias
#   KEY_PASSWORD      - the key password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Write the Firebase config for push. If the secret isn't set, the build still succeeds -
      # the google-services plugin is applied only when this file exists, so push is simply inert.
      - name: Write google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret set - building without push (google-services plugin skipped)."
            exit 0
          fi
          # Accept either base64 (recommended) or raw JSON pasted straight into the secret,
          # and tolerate any line-wrapping/whitespace from copy-paste.
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          fi
          if python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null; then
            echo "Wrote app/google-services.json ($(wc -c < app/google-services.json) bytes) - push enabled."
          else
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 did not resolve to valid JSON. Re-copy it and update the secret."
            exit 1
          fi

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Unique, always-increasing version code per build so Play never rejects a re-upload.
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "Building with versionCode $VERSION_CODE"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease --stacktrace --no-daemon
          else
            gradle bundleRelease --stacktrace --no-daemon
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: spheredex-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
