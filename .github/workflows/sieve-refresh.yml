name: Sieve Scheduled Refresh

# Pulls News + Releases twice daily from the official Palworld TCG site (Sieve) and
# @PalworldOCG_EN (official X API). X is optional; official news must still consolidate and publish.
# Output: POST to the SphereDex backend /api/admin/news (X-Admin-Key) for the app's News and Home feed.

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Verify secrets source
        run: |
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id=${{ secrets.INFISICAL_CLIENT_ID }} --client-secret=${{ secrets.INFISICAL_CLIENT_SECRET }} --silent --plain)
          infisical run --projectId=9f3ed16d-7a03-4b16-9bcd-6f9709350b4e --env=dev -- python tools/sieve_run.py doctor

      - name: Scrape official news + releases
        id: scrape_official
        continue-on-error: true
        run: |
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id=${{ secrets.INFISICAL_CLIENT_ID }} --client-secret=${{ secrets.INFISICAL_CLIENT_SECRET }} --silent --plain)
          infisical run --projectId=9f3ed16d-7a03-4b16-9bcd-6f9709350b4e --env=dev -- python tools/sieve_run.py run \
            "Extract Palworld TCG news: for each item on this official news page extract title, date, summary, link, and the main image URL if present (card art). Return as JSON array with fields title, date, summary, link, image." \
            --url https://en.palworld-official-cardgame.com/news/ \
            --fields title,date,summary,link,image \
            --shape long

      # x.com's robots.txt is Disallow: /, so Sieve refuses to scrape it; posts come from the
      # official X API v2 instead (pay-per-use, at most 10 posts per run). Needs X_BEARER_TOKEN
      # (optionally X_USER_ID) in Infisical; without it the step skips and the feed still publishes.
      - name: Fetch X posts (official X API)
        id: scrape_x
        continue-on-error: true
        run: |
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id=${{ secrets.INFISICAL_CLIENT_ID }} --client-secret=${{ secrets.INFISICAL_CLIENT_SECRET }} --silent --plain)
          infisical run --projectId=9f3ed16d-7a03-4b16-9bcd-6f9709350b4e --env=dev -- python tools/fetch_x_posts.py --root stage/sieve --github-output "$GITHUB_OUTPUT"

      # Option A for the Home card-reveal slide (docs/x-reveal-source-proposal.md): the official
      # site's REST API is robots-permitted and carries reveal posts with cardlist art. Stages a
      # Sieve-style session that consolidation picks up below; never blocks the official scrape.
      - name: Fetch official card reveals (REST, robots-permitted)
        if: always()
        run: python tools/fetch_card_reveals.py --root stage/sieve

      - name: Consolidate Sieve results
        id: consolidate
        if: always()
        run: python tools/news_feed.py --root stage/sieve --output stage/news-feed.json --github-output "$GITHUB_OUTPUT"

      - name: POST to backend (/api/admin/news)
        if: always() && steps.consolidate.outcome == 'success'
        env:
          BACKEND_URL: https://spheredex-backend.craigjayedit.workers.dev
          INGEST_KEY: ${{ secrets.BACKEND_ADMIN_KEY }}
          X_STATUS: ${{ steps.scrape_x.outputs.status }}
        run: |
          if [ ! -s stage/news-feed.json ] || [ "$(cat stage/news-feed.json)" = "[]" ]; then echo "No items to POST - skipping"; exit 0; fi
          if [ -z "$INGEST_KEY" ]; then echo "::warning::BACKEND_ADMIN_KEY secret is not set - feed not published. Set it to the Worker's ADMIN_KEY value (wrangler secret put ADMIN_KEY)."; exit 0; fi
          # x_complete tells the backend this batch holds the current X posts, so it drops stored
          # X posts that are missing (deleted on X). Only sent when the X API fetch succeeded.
          if [ "$X_STATUS" = "ok" ]; then jq '{items: ., x_complete: true}' stage/news-feed.json > stage/news-post.json; else cp stage/news-feed.json stage/news-post.json; fi
          echo "POSTing $(jq length stage/news-feed.json) items to $BACKEND_URL/api/admin/news (X status: ${X_STATUS:-none})"
          curl --fail-with-body -sS -X POST "$BACKEND_URL/api/admin/news" -H "Content-Type: application/json" -H "X-Admin-Key: $INGEST_KEY" --data-binary @stage/news-post.json -w "\nHTTP %{http_code}\n"

      - name: Report scrape status
        if: always()
        run: |
          if [ "${{ steps.scrape_official.outcome }}" = "failure" ]; then
            echo "::warning::Official-news scrape failed. Inspect its session summary in the uploaded artifact."
          elif [ "${{ steps.consolidate.outputs.official_items }}" = "0" ]; then
            echo "::warning::Official scraper produced no usable items. Inspect its session result and summary in the uploaded artifact."
          fi
          if [ "${{ steps.scrape_x.outputs.status }}" = "skipped" ]; then
            echo "::warning::X posts skipped: X_BEARER_TOKEN is not set in Infisical (dev). See SECRETS.md."
          elif [ "${{ steps.scrape_x.outcome }}" = "failure" ]; then
            echo "::warning::X API fetch failed. Its error (HTTP status and API detail) is in the step log. Do not fall back to scraping x.com; its robots.txt is Disallow: /."
          elif [ "${{ steps.consolidate.outputs.x_items }}" = "0" ]; then
            echo "::warning::X API returned no usable posts. Inspect the x-api session in the uploaded artifact."
          else
            echo "X feed items published: ${{ steps.consolidate.outputs.x_items }}"
          fi

      - name: Upload Sieve sessions (artifact, no commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sieve-news-feed
          path: |
            stage/news-feed.json
            stage/sieve/
          if-no-files-found: warn
          retention-days: 7
