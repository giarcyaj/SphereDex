name: Tests

# Guards on every push to main:
#   1. tools/test_carousel.cjs — the featured-carousel section (markers, four-copy sync,
#      behaviour on a stub DOM) so edits to paldeck.html cannot silently regress it.
#   2. tools/test_scan_review.cjs — the scan session/review sheet, same treatment.
#   3. tools/test_editions.cjs — CSV/edition/scan logic, extracted from the same source file.
#   4. The Python pipeline tests — Sieve sessions, news consolidation, rebuild, and the
#      app bundle regeneration itself.
#   5. A rebuild + git diff so a src/ edit without regenerated WEB/Android/iOS bundles
#      fails the push instead of shipping stale bundles.
#   6. A plain grep fails fast (before Node is even installed, independent of the .cjs suites)
#      if the FEATURED CAROUSEL or SCAN REVIEW markers vanish or duplicate in src/paldeck.html.
# Everything is stdlib-only on both runtimes: no dependency install step to rot.

# No standalone push trigger: build-apk.yml calls this workflow as a gate on every push to
# main, so the guards run exactly once per push AND block the APK build. Pull requests run
# the same guards (never blocked by, and never blocking, the main-branch gate). If build-apk
# is ever disabled, re-add "push: branches: [ main ]" here or the guards stop running.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Carousel + editions guards (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Belt and braces: the .cjs suites assert marker placement and four-copy sync in detail, but
      # this plain grep fails first — and even if the suites themselves were deleted or broken —
      # if a section's markers go missing or get duplicated in the canonical source.
      - name: Section markers present exactly once (carousel + scan review)
        run: |
          fail=0
          for marker in \
            "FEATURED CAROUSEL BEGIN (styles" \
            "FEATURED CAROUSEL END (styles)" \
            "FEATURED CAROUSEL BEGIN (logic" \
            "FEATURED CAROUSEL END (logic)" \
            "SCAN REVIEW BEGIN (styles" \
            "SCAN REVIEW END (styles)" \
            "SCAN REVIEW BEGIN (logic" \
            "SCAN REVIEW END (logic)"; do
            count=$(grep -c -F "$marker" src/paldeck.html || true); count=${count:-0}
            if [ "$count" != "1" ]; then
              echo "::error::src/paldeck.html must contain exactly one occurrence of: $marker (found ${count})"
              fail=1
            fi
          done
          exit $fail

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Featured-carousel guard suite
        run: node tools/test_carousel.cjs

      - name: Scan-review guard suite
        run: node tools/test_scan_review.cjs

      - name: Editions / CSV guard suite
        run: node tools/test_editions.cjs

  python:
    name: Pipeline tests + bundle sync (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tool tests (news feed, Sieve, rebuild)
        working-directory: tools
        run: python -m unittest discover -p 'test_*.py' -v

      # The canonical source and the three shipped bundles must move together (src/README.md).
      # rebuild.py is deterministic — same inputs, same bytes — so any real drift shows as a diff.
      - name: Regenerate bundles and fail on drift
        run: |
          python tools/rebuild.py
          git diff --exit-code -- docs/app/index.html docs/app/sw.js \
            app/src/main/assets/spheredex.html \
            ios/SphereDex/SphereDex/Resources/spheredex.html \
            || (echo "::error::src/paldeck.html changed but the WEB/Android/iOS bundles were not rebuilt. Run: python tools/rebuild.py" && exit 1)
