<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SphereDex · Weekly summary preview</title>
<style>
  :root{--bg:#0d1518;--surface:#152125;--surface2:#1d2c31;--line:#395158;--ink:#eef7f6;--soft:#a9c0c2;--accent:#53d3cb;--accentink:#8eeae3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1c3739 0,var(--bg) 55%);color:var(--ink);font:16px Inter,system-ui,sans-serif}.phone{width:min(100%,430px);border:1px solid #49656a;border-radius:28px;background:linear-gradient(180deg,#1b2a2f,var(--bg));padding:12px;box-shadow:0 28px 72px #0009}.app{padding:14px 10px 22px}.brand{font-weight:850;font-size:1.35rem}.sub{color:var(--soft);font-size:.78rem;margin:3px 0 18px}.card{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(145deg,#183438,var(--surface));box-shadow:0 9px 28px #0004}.label{display:flex;align-items:center;gap:7px;color:var(--accentink);font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.icon{width:19px;height:19px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:.7rem}.title{margin:10px 0 13px;font-weight:780;font-size:1.06rem}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}.meta{font-size:.72rem;color:var(--soft)}.actions{display:flex;gap:9px}.actions button{border:0;background:transparent;color:var(--accentink);font:750 .75rem Inter,system-ui,sans-serif;padding:6px 0;cursor:pointer}.actions button+button{border-left:1px solid var(--line);padding-left:9px}.caption{text-align:center;color:var(--soft);font-size:.72rem;margin-top:17px}.caption b{color:var(--accentink)}</style>
<main class="phone"><section class="app"><div class="brand">SphereDex</div><div class="sub">What should you collect next?</div><article class="card"><div class="label"><span class="icon">↻</span>Your collection update</div><div class="title">3 cards added since your last visit</div><div class="foot"><span class="meta">18 hours since your last visit · Weekly summary · 5 collected</span><span class="actions"><button>View recent</button><button>Find next card</button></span></div></article><p class="caption"><b>Preview</b> · shown when cards were added recently or during the last seven days</p></section></main>
