# XcodeGen spec. Run `xcodegen generate` in this folder to create SphereDex.xcodeproj.
name: SphereDex
options:
  bundleIdPrefix: app
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
targets:
  SphereDex:
    type: application
    platform: iOS
    sources:
      - path: SphereDex
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spheredex
        PRODUCT_NAME: SphereDex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SphereDex/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Version source of truth for Xcode Cloud (ci_post_clone.sh regenerates the project from this).
        # Keep in step with android/src/paldeck.html APP_VERSION and app/build.gradle.kts on each release.
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team in Xcode > Signing & Capabilities before building to a device.
        DEVELOPMENT_TEAM: ""
# An explicit scheme makes XcodeGen write a SHARED scheme (xcshareddata/xcschemes), which Xcode Cloud
# requires to find something to build. Archive uses the Release config.
schemes:
  SphereDex:
    build:
      targets:
        SphereDex: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
